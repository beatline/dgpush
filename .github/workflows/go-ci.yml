name: Go CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.20', '1.21', '1.22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Get dependencies
        run: |
          if [ -f go.mod ]; then
            go mod download
            go mod verify
          fi

      - name: Build push-gateway
        run: |
          if [ -d cmd/push-gateway ]; then
            go build -v -o bin/push-gateway ./cmd/push-gateway
          elif [ -d push-gateway ]; then
            cd push-gateway && go build -v -o ../bin/push-gateway .
          else
            echo "push-gateway module not found yet, skipping build"
          fi

      - name: Build push-worker
        run: |
          if [ -d cmd/push-worker ]; then
            go build -v -o bin/push-worker ./cmd/push-worker
          elif [ -d push-worker ]; then
            cd push-worker && go build -v -o ../bin/push-worker .
          else
            echo "push-worker module not found yet, skipping build"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get dependencies
        run: |
          if [ -f go.mod ]; then
            go mod download
          fi

      - name: Run tests
        run: |
          if [ -f go.mod ]; then
            go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          else
            echo "No go.mod found yet, skipping tests"
          fi

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          fail_ci_if_error: false
